name: PawsKernel - S8 G950F Profile A

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build PawsKernel A
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            zip

      - name: Setup GCC 4.9
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify source
        run: |
          set -e

          test -f Makefile
          test -f arch/arm64/configs/exynos8895-dreamlte_defconfig
          test -f arch/arm64/boot/dts/exynos/exynos8895.dtsi

          echo "===== Checking BOOSTER governor ====="

          if grep -Riq 'booster' \
            arch/arm64 \
            drivers 2>/dev/null; then
            echo "BOOSTER governor source: FOUND"
          else
            echo "ERROR: BOOSTER governor source was not found"
            exit 1
          fi

          echo "===== Checking ZRAM ====="

          if grep -q 'CONFIG_ZRAM' \
            arch/arm64/configs/exynos8895-dreamlte_defconfig; then
            echo "ZRAM config: FOUND"
          else
            echo "WARNING: ZRAM is not explicitly configured in defconfig"
          fi

      - name: Configure PawsKernel
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            exynos8895-dreamlte_defconfig

          echo
          echo "===== Base configuration ====="

          grep -E \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_|CONFIG_CPU_FREQ_GOV_|CONFIG_DEFAULT_TCP_CONG|CONFIG_ZRAM|CONFIG_ZSMALLOC' \
            out/.config || true

      - name: Apply Profile A configuration
        run: |
          set -e

          echo "===== Applying PawsKernel Profile A ====="

          # CPU governor: performance
          ./scripts/config \
            --file out/.config \
            -e CPU_FREQ_GOV_PERFORMANCE \
            -e CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            -d CPU_FREQ_DEFAULT_GOV_INTERACTIVE

          # TCP default: cubic
          ./scripts/config \
            --file out/.config \
            --set-str DEFAULT_TCP_CONG cubic

          # Keep CPU/GPU frequency tables STOCK.
          # No CPU OC.
          # No GPU 839 MHz override.

          # Keep thermal safety mechanisms enabled.
          # Do NOT remove TMU / thermal shutdown protection.

          # ZRAM: enable only if the source provides the options.
          if grep -q '^CONFIG_ZRAM=' out/.config; then
            ./scripts/config --file out/.config -e ZRAM
          fi

          if grep -q '^CONFIG_ZSMALLOC=' out/.config; then
            ./scripts/config --file
