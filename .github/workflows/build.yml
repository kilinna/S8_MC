name: PawsKernel - S8 G950F Profile A

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build PawsKernel A
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            zip

      - name: Setup GCC 4.9
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify source
        run: |
          set -e

          test -f Makefile
          test -f arch/arm64/configs/exynos8895-dreamlte_defconfig
          test -f arch/arm64/boot/dts/exynos/exynos8895.dtsi

          echo "Checking BOOSTER governor..."

          if grep -Riq 'booster' \
            arch/arm64 \
            drivers 2>/dev/null
          then
            echo "BOOSTER source: FOUND"
          else
            echo "ERROR: BOOSTER source not found"
            exit 1
          fi

      - name: Configure kernel
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            exynos8895-dreamlte_defconfig

          echo "Base configuration:"
          grep -E \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_|CONFIG_CPU_FREQ_GOV_|CONFIG_DEFAULT_TCP_CONG|CONFIG_ZRAM|CONFIG_ZSMALLOC' \
            out/.config || true

      - name: Apply PawsKernel Profile A
        run: |
          set -e

          echo "Applying Profile A..."

          # CPU governor = performance
          ./scripts/config \
            --file out/.config \
            -e CPU_FREQ_GOV_PERFORMANCE

          ./scripts/config \
            --file out/.config \
            -e CPU_FREQ_DEFAULT_GOV_PERFORMANCE

          ./scripts/config \
            --file out/.config \
            -d CPU_FREQ_DEFAULT_GOV_INTERACTIVE

          # TCP congestion control = cubic
          ./scripts/config \
            --file out/.config \
            --set-str DEFAULT_TCP_CONG cubic

          # ZRAM / ZSMALLOC only when supported
          if grep -q '^CONFIG_ZRAM=' out/.config; then
            ./scripts/config \
              --file out/.config \
              -e ZRAM
          fi

          if grep -q '^CONFIG_ZSMALLOC=' out/.config; then
            ./scripts/config \
              --file out/.config \
              -e ZSMALLOC
          fi

          # Recalculate dependencies
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            olddefconfig

          echo "Profile A configuration:"
          grep -E \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_|CONFIG_CPU_FREQ_GOV_|CONFIG_DEFAULT_TCP_CONG|CONFIG_ZRAM|CONFIG_ZSMALLOC' \
            out/.config || true

      - name: Verify GPU governor
        run: |
          set -e

          echo "Checking GPU governor..."

          grep -n \
            'governor = "booster"' \
            arch/arm64/boot/dts/exynos/exynos8895.dtsi

          echo "GPU governor BOOSTER found."

      - name: Verify no OC patch
        run: |
          echo "Checking for obvious OC overrides..."

          grep -n \
            'gpu_max_clock\|gpu_max_clock_limit' \
            arch/arm64/boot/dts/exynos/exynos8895.dtsi || true

          echo "No OC modification is applied by this workflow."

      - name: Build kernel
        run: |
          set -e

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Build Image.gz-dtb
        run: |
          set -e

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            Image.gz-dtb

          test -f \
            out/arch/arm64/boot/Image.gz-dtb

      - name: Build DTB image
        run: |
          set -e

          if grep -q '^CONFIG_EXYNOS_DTBTOOL=y' out/.config; then
            make -j"$(nproc)" \
              O=out \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-android- \
              dtb.img
          else
            echo "DTB tool not enabled; skipping dtb.img."
          fi

      - name: Prepare artifact
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifact/Image.gz-dtb

          cp \
            out/.config \
            artifact/kernel.config

          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp \
              out/arch/arm64/boot/dtb.img \
              artifact/dtb.img
          fi

          cat > artifact/PawsKernel-A.txt <<'EOF'
PawsKernel
Galaxy S8 G950F / DreamLTE
Profile A

CPU frequency: STOCK
GPU frequency: STOCK
CPU governor: performance
GPU governor: booster
TCP: cubic
ZRAM: enabled when supported
Thermal safety: RETAINED
CPU OC: NONE
GPU OC: NONE
EOF

      - name: Package PawsKernel
        run: |
          set -e

          cd artifact

          zip -9 \
            ../PawsKernel-G950F-A.zip \
            Image.gz-dtb \
            kernel.config \
            PawsKernel-A.txt

          if [ -f dtb.img ]; then
            zip -9 \
              ../PawsKernel-G950F-A.zip \
              dtb.img
          fi

      - name: Upload PawsKernel
        uses: actions/upload-artifact@v4
        with:
          name: PawsKernel-G950F-A
          path: PawsKernel-G950F-A.zip
          if-no-files-found: error
