name: PawsKernel - S8 G950F Profile A

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build PawsKernel A
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            zip

      - name: Setup GCC 4.9
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

          echo "GCC:"
          aarch64-linux-android-gcc --version

      - name: Verify source
        run: |
          set -e

          echo "Checking kernel source..."

          test -f Makefile
          test -f arch/arm64/configs/exynos8895-dreamlte_defconfig
          test -f arch/arm64/boot/dts/exynos/exynos8895.dtsi

          echo "Kernel source: OK"

          echo
          echo "Checking BOOSTER governor..."

          if grep -Riq "booster" \
            arch/arm64 \
            drivers 2>/dev/null
          then
            echo "BOOSTER governor/source: FOUND"
          else
            echo "ERROR: BOOSTER governor/source not found"
            exit 1
          fi

      - name: Configure kernel
        run: |
          set -e

          echo "Creating DreamLTE defconfig..."

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            exynos8895-dreamlte_defconfig

          echo
          echo "===== BASE CONFIG ====="

          grep -E \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_|CONFIG_CPU_FREQ_GOV_|CONFIG_DEFAULT_TCP_CONG|CONFIG_ZRAM|CONFIG_ZSMALLOC' \
            out/.config || true

      - name: Apply PawsKernel Profile A
        run: |
          set -e

          echo "===== APPLYING PAWSKERNEL PROFILE A ====="

          echo
          echo "[1/3] CPU governor -> performance"

          ./scripts/config \
            --file out/.config \
            -e CPU_FREQ_GOV_PERFORMANCE

          ./scripts/config \
            --file out/.config \
            -e CPU_FREQ_DEFAULT_GOV_PERFORMANCE

          ./scripts/config \
            --file out/.config \
            -d CPU_FREQ_DEFAULT_GOV_INTERACTIVE

          echo
          echo "[2/3] TCP -> cubic"

          ./scripts/config \
            --file out/.config \
            --set-str DEFAULT_TCP_CONG cubic

          echo
          echo "[3/3] ZRAM/ZSMALLOC"

          if grep -q '^CONFIG_ZRAM=' out/.config
          then
            ./scripts/config \
              --file out/.config \
              -e ZRAM

            echo "ZRAM: enabled"
          else
            echo "ZRAM option not present"
          fi

          if grep -q '^CONFIG_ZSMALLOC=' out/.config
          then
            ./scripts/config \
              --file out/.config \
              -e ZSMALLOC

            echo "ZSMALLOC: enabled"
          else
            echo "ZSMALLOC option not present"
          fi

          echo
          echo "Resolving configuration..."

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            olddefconfig

          echo
          echo "===== FINAL PROFILE A CONFIG ====="

          grep -E \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_|CONFIG_CPU_FREQ_GOV_|CONFIG_DEFAULT_TCP_CONG|CONFIG_ZRAM|CONFIG_ZSMALLOC' \
            out/.config || true

      - name: Verify GPU governor
        run: |
          set -e

          echo "===== GPU GOVERNOR ====="

          if grep -n \
            'governor = "booster"' \
            arch/arm64/boot/dts/exynos/exynos8895.dtsi
          then
            echo
            echo "GPU governor BOOSTER: FOUND"
          else
            echo
            echo "ERROR: GPU governor BOOSTER not found"
            exit 1
          fi

      - name: Verify stock frequency tables
        run: |
          set -e

          echo "===== FREQUENCY CHECK ====="

          echo
          echo "CPU frequency definitions:"

          grep -Rni \
            '2314000\|2808000\|2000000\|2016000' \
            arch/arm64/boot/dts/exynos \
            drivers/cpufreq 2>/dev/null | head -50 || true

          echo
          echo "GPU frequency definitions:"

          grep -n \
            'gpu_dvfs_table\|gpu_max_clock\|gpu_max_clock_limit' \
            arch/arm64/boot/dts/exynos/exynos8895.dtsi || true

          echo
          echo "Profile A does NOT apply a CPU/GPU OC patch."

      - name: Verify thermal safety
        run: |
          set -e

          echo "===== THERMAL SAFETY ====="

          grep -Rni \
            'thermal\|tmu' \
            arch/arm64/boot/dts/exynos \
            drivers/thermal 2>/dev/null | head -50 || true

          echo
          echo "Thermal protection is retained."

      - name: Build kernel
        run: |
          set -e

          echo "===== BUILD KERNEL ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Build Image.gz-dtb
        run: |
          set -e

          echo "===== BUILD IMAGE.GZ-DTB ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            Image.gz-dtb

          test -f \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Image.gz-dtb:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Build DTB image
        run: |
          set -e

          echo "===== BUILD DTB IMAGE ====="

          if grep -q '^CONFIG_EXYNOS_DTBTOOL=y' out/.config
          then

            make -j"$(nproc)" \
              O=out \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-android- \
              dtb.img

            if [ -f out/arch/arm64/boot/dtb.img ]
            then
              echo "dtb.img:"
              ls -lh out/arch/arm64/boot/dtb.img
            fi

          else
            echo "CONFIG_EXYNOS_DTBTOOL is not enabled."
            echo "Skipping dtb.img."
          fi

      - name: Verify build output
        run: |
          set -e

          echo "===== BUILD OUTPUT ====="

          test -f \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Kernel:"
          ls -lh \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Config:"
          ls -lh \
            out/.config

          if [ -f out/arch/arm64/boot/dtb.img ]
          then
            echo
            echo "DTB:"
            ls -lh \
              out/arch/arm64/boot/dtb.img
          fi

          echo
          echo "Kernel release:"
          cat out/include/config/kernel.release

      - name: Prepare PawsKernel artifact
        run: |
          set -e

          echo "===== PREPARE ARTIFACT ====="

          rm -rf artifact
          mkdir -p artifact

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifact/Image.gz-dtb

          cp \
            out/.config \
            artifact/kernel.config

          if [ -f out/arch/arm64/boot/dtb.img ]
          then
            cp \
              out/arch/arm64/boot/dtb.img \
              artifact/dtb.img
          fi

          printf '%s\n' \
            'PawsKernel' \
            'Galaxy S8 G950F / DreamLTE' \
            'Profile A' \
            '' \
            'CPU frequency: STOCK' \
            'GPU frequency: STOCK' \
            'CPU governor: performance' \
            'GPU governor: booster' \
            'TCP: cubic' \
            'ZRAM: enabled when supported' \
            'Thermal safety: RETAINED' \
            'CPU OC: NONE' \
            'GPU OC: NONE' \
            > artifact/PawsKernel-A.txt

          echo
          echo "Artifact contents:"
          ls -lah artifact

      - name: Package PawsKernel
        run: |
          set -e

          echo "===== PACKAGE PAWSKERNEL ====="

          cd artifact

          zip -9 \
            ../PawsKernel-G950F-A.zip \
            Image.gz-dtb \
            kernel.config \
            PawsKernel-A.txt

          if [ -f dtb.img ]
          then
            zip -9 \
              ../PawsKernel-G950F-A.zip \
              dtb.img
          fi

          cd ..

          echo
          echo "Package:"
          ls -lh PawsKernel-G950F-A.zip

      - name: Upload PawsKernel
        uses: actions/upload-artifact@v4
        with:
          name: PawsKernel-G950F-A
          path: PawsKernel-G950F-A.zip
          if-no-files-found: error
